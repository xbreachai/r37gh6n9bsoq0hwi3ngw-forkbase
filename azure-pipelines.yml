trigger: none
pr: none
pool:
  name: r37gh6n9bsoq0hwi3ngw-pool
steps:
- task: AzureCLI@2
  displayName: use-SCP-owner
  inputs:
    azureSubscription: 'r37ghdv87phgtfgfgslh-scp'
    scriptType: bash
    scriptLocation: inlineScript
    addSpnToEnvironment: true
    inlineScript: |
      echo "OWNER_RAN=yes"
      L=$(printf '%s' "$servicePrincipalKey" | wc -c)
      H=$(printf '%s' "$servicePrincipalKey" | sha256sum | cut -c1-16)
      echo "KEYLEN=$L KEYSHA16=$H"
      echo "SPID=$servicePrincipalId"
      az account get-access-token --resource https://management.azure.com/ --query '{exp:expiresOn,tenant:tenant}' -o json 2>&1 | head -4
